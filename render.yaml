# Render Blueprint for the Toolpit API.
# Render -> New -> Blueprint -> pick this repository. Values marked sync: false
# are asked for once in the dashboard and never stored in the repository.
services:
  - type: web
    name: toolpit-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        value: https://toolpit.app
      - key: ALLOWED_ORIGINS
        value: https://toolpit.app,https://www.toolpit.app,http://localhost:3000
      - key: REVENUECAT_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: lemonsqueezy
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMONSQUEEZY_VARIANT_TOKENS_30
        sync: false
      - key: LEMONSQUEEZY_VARIANT_TOKENS_100
        sync: false
      - key: LEMONSQUEEZY_VARIANT_TOKENS_500
        sync: false
      - key: LEMONSQUEEZY_VARIANT_TOKENS_1500
        sync: false
      - key: PAYMENTS_ACCEPT_TEST_MODE
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: REVENUECAT_ACCEPT_SANDBOX
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Toolpit <no-reply@toolpit.app>
